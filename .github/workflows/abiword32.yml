name: Build AbiWord i686

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MSYS2
        run: choco install msys2 -y

      - name: Create Build Script
        shell: cmd
        run: |
          echo set -e > build.sh
          echo pacman -Syu --noconfirm >> build.sh
          echo pacman -S --noconfirm base-devel autoconf-archive zstd wget patch mingw-w64-i686-toolchain mingw-w64-i686-asio mingw-w64-i686-autotools mingw-w64-i686-boost mingw-w64-i686-enchant mingw-w64-i686-fribidi mingw-w64-i686-glib2 mingw-w64-i686-libgcrypt mingw-w64-i686-libgda mingw-w64-i686-libgsf mingw-w64-i686-libical mingw-w64-i686-libjpeg-turbo mingw-w64-i686-libpng mingw-w64-i686-librevenge mingw-w64-i686-libwmf mingw-w64-i686-libwpg mingw-w64-i686-libwps mingw-w64-i686-libxml2 mingw-w64-i686-libxslt mingw-w64-i686-redland mingw-w64-i686-wv mingw-w64-i686-zlib >> build.sh
          echo wget https://mirror.msys2.org/mingw/sources/mingw-w64-abiword-3.0.8-1.src.tar.zst >> build.sh
          echo tar -I zstd -xvf mingw-w64-abiword-3.0.8-1.src.tar.zst >> build.sh
          echo cd mingw-w64-abiword-3.0.8-1 >> build.sh
          echo tar -xvf src/*.tar.* >> build.sh
          echo cd abiword* >> build.sh
          echo for p in ../*.patch; do patch -p1 < "$p"; done >> build.sh
          echo mkdir build && cd build >> build.sh
          echo ../configure --host=i686-w64-mingw32 --prefix=/mingw32 >> build.sh
          echo make -j$(nproc) >> build.sh
          echo make install >> build.sh

      - name: Execute Build
        shell: cmd
        run: |
          set MSYSTEM=MINGW32
          set PATH=C:\msys64\mingw32\bin;C:\msys64\usr\bin;%PATH%
          C:\msys64\usr\bin\bash.exe build.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: abiword-i686-binaries
          path: C:\msys64\mingw32\bin\abiword*
