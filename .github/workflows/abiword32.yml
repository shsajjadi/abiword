name: Build AbiWord i686

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MSYS2
        run: choco install msys2 -y

      - name: Build AbiWord
        shell: cmd
        run: |
          # 1. Install Base Tools, Build-time Dependencies, and Runtime Dependencies
          "C:\msys64\msys2_shell.cmd" -mingw32 -c "pacman -Syu --noconfirm && pacman -S --noconfirm base-devel autoconf-archive zstd wget patch mingw-w64-i686-toolchain mingw-w64-i686-asio mingw-w64-i686-autotools mingw-w64-i686-boost mingw-w64-i686-enchant mingw-w64-i686-fribidi mingw-w64-i686-glib2 mingw-w64-i686-libgcrypt mingw-w64-i686-libgda mingw-w64-i686-libgsf mingw-w64-i686-libical mingw-w64-i686-libjpeg-turbo mingw-w64-i686-libpng mingw-w64-i686-librevenge mingw-w64-i686-libwmf mingw-w64-i686-libwpg mingw-w64-i686-libwps mingw-w64-i686-libxml2 mingw-w64-i686-libxslt mingw-w64-i686-redland mingw-w64-i686-wv mingw-w64-i686-zlib"
          
          # 2. Download and extract the MSYS2 source bundle
          "C:\msys64\msys2_shell.cmd" -mingw32 -c "wget https://mirror.msys2.org/mingw/sources/mingw-w64-abiword-3.0.8-1.src.tar.zst && tar -I zstd -xvf mingw-w64-abiword-3.0.8-1.src.tar.zst"
          
          # 3. Extract upstream source and apply all patches
          "C:\msys64\msys2_shell.cmd" -mingw32 -c "cd mingw-w64-abiword-3.0.8-1 && tar -xvf src/*.tar.* && cd abiword* && for p in ../*.patch; do patch -p1 < \"$p\"; done"
          
          # 4. Configure and build
          "C:\msys64\msys2_shell.cmd" -mingw32 -c "cd mingw-w64-abiword-3.0.8-1/abiword* && mkdir build && cd build && ../configure --host=i686-w64-mingw32 --prefix=/mingw32 && make -j$(nproc) && make install"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: abiword-i686-binaries
          path: C:\msys64\mingw32\bin\abiword*
