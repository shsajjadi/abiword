name: Build AbiWord i686

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MSYS2
        run: choco install msys2 -y

      - name: Create Build Script
        shell: powershell
        run: |
          $script = @'
          set -e
          # 1. Install all toolchain and dependency packages
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel autoconf-archive zstd wget patch bzip2 gettext \
            mingw-w64-i686-toolchain mingw-w64-i686-asio mingw-w64-i686-autotools \
            mingw-w64-i686-boost mingw-w64-i686-enchant mingw-w64-i686-fribidi \
            mingw-w64-i686-glib2 mingw-w64-i686-libgcrypt mingw-w64-i686-libgda \
            mingw-w64-i686-libgsf mingw-w64-i686-libical mingw-w64-i686-libjpeg-turbo \
            mingw-w64-i686-libpng mingw-w64-i686-librevenge mingw-w64-i686-libwmf \
            mingw-w64-i686-libwpg mingw-w64-i686-libwps mingw-w64-i686-libxml2 \
            mingw-w64-i686-libxslt mingw-w64-i686-redland mingw-w64-i686-wv mingw-w64-i686-zlib

          # 2. Source extraction
          wget https://mirror.msys2.org/mingw/sources/mingw-w64-abiword-3.0.8-1.src.tar.zst
          tar -I zstd -xvf mingw-w64-abiword-3.0.8-1.src.tar.zst
          cd mingw-w64-abiword
          tar -xvf AbiWord-release-3.0.8.tar.bz2
          cd AbiWord-release-3.0.8

          # 3. Patching (Skipping clang-specific patch as per PKGBUILD)
          for p in ../*.patch; do
            if [[ "$p" == *"clang"* ]]; then
              echo "Skipping clang patch $p"
            else
              echo "Applying $p"
              patch -Nbp1 -i "$p"
            fi
          done

          # 4. Preparation (Crucial step from PKGBUILD)
          ./autogen-common.sh
          autoreconf -fiv

          # 5. Build configuration
          mkdir -p "build-MINGW32" && cd "build-MINGW32"
          
          export lt_cv_deplibs_check_method='pass_all'
          export CXXFLAGS="-w -DWIN32"
          export LDFLAGS="-lpthread"

          ../configure \
            --host=i686-w64-mingw32 \
            --prefix=/mingw32 \
            --enable-shared \
            --enable-plugins \
            --enable-clipart \
            --enable-templates

          make -j$(nproc)
          make install
          '@
          Set-Content -Path build.sh -Value $script -Encoding utf8

      - name: Execute Build
        shell: cmd
        run: |
          set MSYSTEM=MINGW32
          set PATH=C:\msys64\mingw32\bin;C:\msys64\usr\bin;%PATH%
          C:\msys64\usr\bin\bash.exe build.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: abiword-i686-binaries
          path: C:\msys64\mingw32\bin\abiword*
