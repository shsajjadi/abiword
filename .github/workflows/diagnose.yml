
name: Build AbiWord i686

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          autocrlf: input

      - name: Setup MSYS2 MINGW32
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            base-devel
            git
            wget
            patch
            bzip2
            zstd
            autoconf
            automake
            autoconf-archive
            gettext
            pkgconf
            mingw-w64-i686-toolchain

      - name: Verify toolchain
        run: |
          set -euxo pipefail

          echo "MSYSTEM=$MSYSTEM"
          echo "MINGW_PREFIX=$MINGW_PREFIX"

          test "$MSYSTEM" = MINGW32
          test -x /mingw32/bin/gcc.exe
          test -x /mingw32/bin/g++.exe

          gcc --version
          g++ --version
          make --version
          pacman-conf --repo-list

      - name: Check and install AbiWord dependencies
        run: |
          set -euo pipefail

          packages=(
            mingw-w64-i686-asio
            mingw-w64-i686-boost
            mingw-w64-i686-enchant
            mingw-w64-i686-fribidi
            mingw-w64-i686-glib2
            mingw-w64-i686-libgcrypt
            mingw-w64-i686-libgda
            mingw-w64-i686-libgsf
            mingw-w64-i686-libical
            mingw-w64-i686-libjpeg-turbo
            mingw-w64-i686-libpng
            mingw-w64-i686-libxml2
            mingw-w64-i686-libxslt
            mingw-w64-i686-zlib
          )

          missing=()

          for pkg in "${packages[@]}"; do
            echo "::group::Checking $pkg"

            if pacman -Si "$pkg"; then
              echo "Package available: $pkg"
            else
              echo "::error::Package unavailable in configured repositories: $pkg"
              missing+=("$pkg")
            fi

            echo "::endgroup::"
          done

          if ((${#missing[@]})); then
            echo "::error::Some required packages are unavailable."
            printf 'Missing: %s\n' "${missing[@]}"
            exit 1
          fi

          pacman -S --needed --noconfirm "${packages[@]}"

      - name: Download and extract AbiWord source package
        run: |
          set -euxo pipefail

          wget -O abiword.src.tar.zst \
            https://mirror.msys2.org/mingw/sources/mingw-w64-abiword-3.0.8-1.src.tar.zst

          tar --zstd -xvf abiword.src.tar.zst

          test -d mingw-w64-abiword

          cd mingw-w64-abiword
          tar -xvf AbiWord-release-3.0.8.tar.bz2

      - name: Apply patches and prepare build
        run: |
          set -euxo pipefail

          cd mingw-w64-abiword/AbiWord-release-3.0.8

          shopt -s nullglob

          for p in ../*.patch; do
            case "$p" in
              *clang*) continue ;;
            esac

            echo "Applying $p"
            patch -Nbp1 -i "$p"
          done

          ./autogen-common.sh
          autoreconf -fiv

      - name: Configure and build AbiWord
        run: |
          set -euxo pipefail

          cd mingw-w64-abiword/AbiWord-release-3.0.8

          export PKG_CONFIG_PATH="/mingw32/lib/pkgconfig"
          export lt_cv_deplibs_check_method=pass_all
          export CXXFLAGS="-w -DWIN32"
          export LDFLAGS="-lpthread"

          mkdir -p build-MINGW32
          cd build-MINGW32

          ../configure \
            --build="$(../config.guess)" \
            --host=i686-w64-mingw32 \
            --prefix=/mingw32 \
            --enable-shared \
            --enable-plugins \
            --enable-clipart \
            --enable-templates

          make -j"$(nproc)"

          mkdir -p "$GITHUB_WORKSPACE/stage"
          make DESTDIR="$GITHUB_WORKSPACE/stage" install

      - name: Collect binaries
        if: success()
        run: |
          set -euxo pipefail

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          find "$GITHUB_WORKSPACE/stage" \
            -type f \
            \( -iname 'abiword*.exe' -o -iname 'abiword*.dll' \) \
            -exec cp -v {} "$GITHUB_WORKSPACE/artifacts/" \;

          if ! compgen -G "$GITHUB_WORKSPACE/artifacts/abiword*" >/dev/null; then
            echo "::error::No AbiWord binaries were produced."
            exit 1
          fi

          ls -lah "$GITHUB_WORKSPACE/artifacts"

      - name: Upload AbiWord binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: abiword-i686-binaries
          path: artifacts/
          if-no-files-found: error
