name: Build AbiWord i686

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MSYS2
        run: choco install msys2 -y

      - name: Update MSYS2 Core
        shell: cmd
        run: set MSYSTEM=MSYS && C:\msys64\usr\bin\bash.exe -lc "pacman -Syu --noconfirm"

      - name: Install Build Tools and Toolchain
        shell: cmd
        run: |
          set MSYSTEM=MINGW32
          C:\msys64\usr\bin\bash.exe -lc "pacman -Syy --noconfirm && pacman -S --noconfirm --needed base-devel autoconf automake autoconf-archive zstd wget patch bzip2 gettext mingw-w64-i686-binutils mingw-w64-i686-crt mingw-w64-i686-gcc mingw-w64-i686-gdb mingw-w64-i686-headers mingw-w64-i686-libgomp mingw-w64-i686-libstdc++ mingw-w64-i686-libwinpthread mingw-w64-i686-make mingw-w64-i686-pkgconf mingw-w64-i686-winpthreads"

      - name: Diagnose and Install MINGW32 Libraries
        shell: cmd
        run: |
          set MSYSTEM=MINGW32
          C:\msys64\usr\bin\bash.exe -lc "set -e; pacman -Syy --noconfirm; for pkg in mingw-w64-i686-asio mingw-w64-i686-autotools mingw-w64-i686-boost mingw-w64-i686-enchant mingw-w64-i686-fribidi mingw-w64-i686-glib2 mingw-w64-i686-libgcrypt mingw-w64-i686-libgda mingw-w64-i686-libgsf mingw-w64-i686-libical mingw-w64-i686-libjpeg-turbo mingw-w64-i686-libpng mingw-w64-i686-libxml2 mingw-w64-i686-libxslt mingw-w64-i686-zlib; do echo Checking \$pkg; pacman -Si \$pkg || exit 1; done"

      - name: Build AbiWord
        shell: cmd
        run: |
          set MSYSTEM=MINGW32
          C:\msys64\usr\bin\bash.exe -lc "set -e; wget https://mirror.msys2.org/mingw/sources/mingw-w64-abiword-3.0.8-1.src.tar.zst; tar -I zstd -xvf mingw-w64-abiword-3.0.8-1.src.tar.zst; cd mingw-w64-abiword; tar -xvf AbiWord-release-3.0.8.tar.bz2; cd AbiWord-release-3.0.8; for p in ../*.patch; do [[ \"$p\" == *\"clang\"* ]] && continue; echo \"Applying $p\"; patch -Nbp1 -i \"$p\"; done; ./autogen-common.sh; autoreconf -fiv; mkdir -p build-MINGW32 && cd build-MINGW32; export PKG_CONFIG_PATH='/mingw32/lib/pkgconfig'; export lt_cv_deplibs_check_method='pass_all'; export CXXFLAGS='-w -DWIN32'; export LDFLAGS='-lpthread'; ../configure --host=i686-w64-mingw32 --prefix=/mingw32 --enable-shared --enable-plugins --enable-clipart --enable-templates; make -j$(nproc); make install"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: abiword-i686-binaries
          path: C:\msys64\mingw32\bin\abiword*          
