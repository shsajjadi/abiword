
name: Build AbiWord i686 Objects

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          autocrlf: input

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
            wget
            patch
            bzip2
            zstd
            autoconf
            automake
            autoconf-archive
            libtool
            gettext
            pkgconf
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-i686-toolchain

      - name: Verify toolchain
        run: |
          set -euxo pipefail

          echo "MSYSTEM=$MSYSTEM"
          echo "MINGW_PREFIX=$MINGW_PREFIX"

          test "$MSYSTEM" = UCRT64
          test -x /ucrt64/bin/gcc.exe

          command -v libtoolize
          command -v autoreconf
          command -v make

          echo "Available i686 compiler:"
          command -v i686-w64-mingw32-gcc
          command -v i686-w64-mingw32-g++

          i686-w64-mingw32-gcc --version
          i686-w64-mingw32-g++ --version
          libtoolize --version
          autoreconf --version
          make --version
          pacman-conf --repo-list

      - name: Install available i686 dependencies
        run: |
          set -uo pipefail

          packages=(
            mingw-w64-i686-asio
            mingw-w64-i686-boost
            mingw-w64-i686-enchant
            mingw-w64-i686-fribidi
            mingw-w64-i686-glib2
            mingw-w64-i686-libgcrypt
            mingw-w64-i686-libgda
            mingw-w64-i686-libgsf
            mingw-w64-i686-libical
            mingw-w64-i686-libjpeg-turbo
            mingw-w64-i686-libpng
            mingw-w64-i686-libxml2
            mingw-w64-i686-libxslt
            mingw-w64-i686-zlib
          )

          : > missing-packages.txt
          : > failed-packages.txt

          for pkg in "${packages[@]}"; do
            echo "::group::Checking $pkg"

            if ! pacman -Si "$pkg" >/dev/null 2>&1; then
              echo "::warning::Package unavailable: $pkg"
              echo "$pkg" >> missing-packages.txt
            elif ! pacman -S --needed --noconfirm "$pkg"; then
              echo "::warning::Could not install: $pkg"
              echo "$pkg" >> failed-packages.txt
            else
              echo "Installed: $pkg"
            fi

            echo "::endgroup::"
          done

      - name: Download and extract AbiWord source
        run: |
          set -euxo pipefail

          wget -O abiword.src.tar.zst \
            https://mirror.msys2.org/mingw/sources/mingw-w64-abiword-3.0.8-1.src.tar.zst

          tar --zstd -xf abiword.src.tar.zst

          test -d mingw-w64-abiword

          cd mingw-w64-abiword
          tar -xf AbiWord-release-3.0.8.tar.bz2

      - name: Apply patches and prepare build
        run: |
          set -euxo pipefail

          cd mingw-w64-abiword/AbiWord-release-3.0.8

          shopt -s nullglob

          for p in ../*.patch; do
            case "$p" in
              *clang*) continue ;;
            esac

            echo "Applying $p"
            patch -Nbp1 -i "$p"
          done

          ./autogen-common.sh

          libtoolize --force --copy
          autoreconf -fiv

      - name: Configure i686 build
        run: |
          set -euxo pipefail

          cd mingw-w64-abiword/AbiWord-release-3.0.8

          export CC=i686-w64-mingw32-gcc
          export CXX=i686-w64-mingw32-g++
          export AR=i686-w64-mingw32-ar
          export RANLIB=i686-w64-mingw32-ranlib
          export NM=i686-w64-mingw32-nm
          export STRIP=i686-w64-mingw32-strip

          export PKG_CONFIG=/ucrt64/bin/pkg-config
          export PKG_CONFIG_PATH=/mingw32/lib/pkgconfig:/mingw32/share/pkgconfig
          export PKG_CONFIG_LIBDIR=/mingw32/lib/pkgconfig:/mingw32/share/pkgconfig

          export CFLAGS="-DWIN32"
          export CXXFLAGS="-w -DWIN32"
          export lt_cv_deplibs_check_method=pass_all

          mkdir -p build-UCRT64-i686
          cd build-UCRT64-i686

          ../configure \
            --build="$(../config.guess)" \
            --host=i686-w64-mingw32 \
            --prefix=/mingw32 \
            --enable-shared \
            --enable-plugins \
            --enable-clipart \
            --enable-templates

      - name: Compile without final linking
        run: |
          set -euxo pipefail

          cd mingw-w64-abiword/AbiWord-release-3.0.8/build-UCRT64-i686

          # Build individual object prerequisites rather than the
          # normal all/install targets.
          export PATH="/mingw32/bin:/ucrt64/bin:$PATH"

          echo "Configured compiler:"
          grep -E '^(CC|CXX|AR|RANLIB|NM) =' Makefile || true

          # Compile through the generated Makefiles.
          # This avoids the normal top-level install step.
          make -j"$(nproc)" all-am

      - name: Collect build files and objects
        if: always()
        run: |
          set -euxo pipefail

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          if [ -d mingw-w64-abiword ]; then
            cp -a mingw-w64-abiword "$GITHUB_WORKSPACE/artifacts/"
          fi

          for file in abiword.src.tar.zst missing-packages.txt failed-packages.txt; do
            if [ -f "$file" ]; then
              cp -f "$file" "$GITHUB_WORKSPACE/artifacts/"
            fi
          done

          echo "Object count:"
          find "$GITHUB_WORKSPACE/artifacts" \
            -type f \( -name '*.o' -o -name '*.lo' \) |
            wc -l

          find "$GITHUB_WORKSPACE/artifacts" \
            -type f \( -name '*.o' -o -name '*.lo' \) |
            head -100

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abiword-i686-objects
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
