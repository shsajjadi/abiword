
name: Build AbiWord i686

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            base-devel
            msys2-devel
            git
            curl
            zstd
            mingw-w64-i686-toolchain
            mingw-w64-i686-glib2
            mingw-w64-i686-libjpeg-turbo
            mingw-w64-i686-libpng
            mingw-w64-i686-libxml2
            mingw-w64-i686-libxslt
            mingw-w64-i686-gettext-runtime
            mingw-w64-i686-cc
            mingw-w64-i686-autotools

      - name: Download and extract additional MinGW32 packages
        run: |
          set -euo pipefail

          mkdir -p extra-packages
          cd extra-packages

          base_url="https://repo.msys2.org/mingw/mingw32"

          packages=(
            mingw-w64-i686-asio-1.28.1-2-any.pkg.tar.zst
            mingw-w64-i686-boost-1.90.0-3-any.pkg.tar.zst
            mingw-w64-i686-enchant-2.6.5-1-any.pkg.tar.zst
            mingw-w64-i686-fribidi-1.0.16-1-any.pkg.tar.zst
            mingw-w64-i686-libgcrypt-1.12.2-2-any.pkg.tar.zst
            mingw-w64-i686-libgda-5.2.10-1-any.pkg.tar.zst
            mingw-w64-i686-libgsf-1.14.53-1-any.pkg.tar.zst
            mingw-w64-i686-libical-3.0.17-1-any.pkg.tar.zst
          )

          for package in "${packages[@]}"; do
            echo "Downloading ${package}"
            curl -fL --retry 3 \
              --retry-delay 2 \
              -o "$package" \
              "${base_url}/${package}"

            echo "Extracting ${package} into /mingw32"
          tar --zstd -xf "$package" \
            -C /mingw32 \
            --strip-components=1 \
            --no-same-owner \
            --no-same-permissions
          done

          echo "All additional packages extracted."
          echo "Checking libgsf files..."
          find /mingw32 -iname '*gsf*.pc' -o -iname '*gsf*.dll.a'

      - name: Download and extract wv source
        run: |
          set -euo pipefail

          mkdir -p wv-pkg

          curl -fL --retry 3 \
            --retry-delay 2 \
            -o wv.src.tar.zst \
            https://mirror.msys2.org/mingw/sources/mingw-w64-wv-1.2.9-4.src.tar.zst

          echo "wv source archive contents:"
          tar --zstd -tf wv.src.tar.zst | head -80

          tar --zstd -xf wv.src.tar.zst -C wv-pkg

          echo "Extracted wv package files:"
          find wv-pkg -maxdepth 3 -type f

          test -f wv-pkg/mingw-w64-wv/PKGBUILD

      - name: Build wv for i686
        working-directory: wv-pkg/mingw-w64-wv
        run: |
          set -euo pipefail

          export MINGW_ARCH=mingw32
          echo "Patching wv PKGBUILD architecture..."
          sed -i \
            "s/^mingw_arch=.*/mingw_arch=('mingw32')/" \
            PKGBUILD

          echo "Checking wv architecture:"
          grep -n '^mingw_arch=' PKGBUILD
          grep -q "^mingw_arch=('mingw32')$" PKGBUILD

          echo "Building wv for i686..."

          export PKG_CONFIG_PATH="/mingw32/lib/pkgconfig:/mingw32/share/pkgconfig"
          export PKG_CONFIG_LIBDIR="/mingw32/lib/pkgconfig:/mingw32/share/pkgconfig"

          echo "Checking libgsf with pkg-config..."
          pkg-config --modversion libgsf-1
          pkg-config --cflags --libs libgsf-1

          makepkg-mingw \
            --nodeps \
            --clean \
            --force \
            --log \
            --noconfirm \
            --noprogressbar

          echo "Built wv package archives:"
          find . -maxdepth 1 -type f -name '*.pkg.tar.*'

      - name: Extract built wv into MinGW32
        working-directory: wv-pkg/mingw-w64-wv
        run: |
          set -euo pipefail

          shopt -s nullglob
          packages=(mingw-w64-i686-wv-*.pkg.tar.*)

          if (( ${#packages[@]} == 0 )); then
            echo "ERROR: No i686 wv package archive found."
            find . -maxdepth 1 -type f -name '*.pkg.tar.*'
            exit 1
          fi

          for package in "${packages[@]}"; do
            echo "Extracting ${package} into /mingw32"

            case "$package" in
              *.pkg.tar.zst)
                tar --zstd -xf "$package" \
                  -C /mingw32 \
                  --strip-components=1 \
                  --no-same-owner \
                  --no-same-permissions
                ;;
              *.pkg.tar.xz)
                tar -xJf "$package" \
                  -C /mingw32 \
                  --no-same-owner \
                  --no-same-permissions
                ;;
              *.pkg.tar.gz)
                tar -xzf "$package" \
                  -C /mingw32 \
                  --no-same-owner \
                  --no-same-permissions
                ;;
              *)
                echo "ERROR: Unsupported package format: $package"
                exit 1
                ;;
            esac
          done

          echo "wv extracted into /mingw32"

          find /mingw32/include -maxdepth 2 -iname '*wv*' -print
          find /mingw32/lib -maxdepth 2 -iname '*wv*' -print

      - name: Download and extract AbiWord source
        run: |
          set -euo pipefail

          mkdir -p abiword-pkg

          curl -fL --retry 3 \
            --retry-delay 2 \
            -o abiword.src.tar.zst \
            https://mirror.msys2.org/mingw/sources/mingw-w64-abiword-3.0.8-1.src.tar.zst

          echo "AbiWord source archive contents:"
          tar --zstd -tf abiword.src.tar.zst | head -80

          tar --zstd -xf abiword.src.tar.zst \
            -C abiword-pkg

          echo "Extracted AbiWord package files:"
          find abiword-pkg -maxdepth 3 -type f

          test -f abiword-pkg/mingw-w64-abiword/PKGBUILD
      
      - name: Patch AbiWord PKGBUILD
        working-directory: abiword-pkg/mingw-w64-abiword
        run: |
          sed -i '/\.\/autogen-common\.sh/i\  sed -i '\''s/AC_MSG_ERROR(bad value \$enableval for --enable-embedded)/AC_MSG_ERROR([bad value $enableval for --enable-embedded])/'\'' configure.ac' PKGBUILD

      - name: Build AbiWord for i686
        working-directory: abiword-pkg/mingw-w64-abiword
        run: |
          set -euo pipefail

          export MINGW_ARCH=mingw32

          echo "Patching AbiWord PKGBUILD architecture..."
          sed -i \
            "s/^mingw_arch=('ucrt64' 'clang64' 'clangarm64')/mingw_arch=('mingw32')/" \
            PKGBUILD

          echo "Checking patched architecture:"
          grep -n '^mingw_arch=' PKGBUILD
          grep -q "^mingw_arch=('mingw32')$" PKGBUILD

          echo "Patching AbiWord plugin configuration..."

          # Replace --enable-plugins with --disable-default-plugins.
          sed -i \
            '/^[[:space:]]*--enable-plugins[[:space:]]*\\$/c\    --disable-default-plugins \\' \
            PKGBUILD

          # Add --disable-plugins after --disable-default-plugins.
          sed -i \
            '/^[[:space:]]*--disable-default-plugins[[:space:]]*\\$/a\    --disable-plugins \\' \
            PKGBUILD

          echo "Checking plugin options:"
          grep -nE -- '--(enable-plugins|disable-default-plugins|disable-plugins)' PKGBUILD

          ! grep -q -- '--enable-plugins' PKGBUILD
          grep -q -- '--disable-default-plugins' PKGBUILD
          grep -q -- '--disable-plugins' PKGBUILD

          echo "Building AbiWord for i686..."

          export PKG_CONFIG_PATH="/mingw32/lib/pkgconfig:/mingw32/share/pkgconfig"
          export PKG_CONFIG_LIBDIR="/mingw32/lib/pkgconfig:/mingw32/share/pkgconfig"

          makepkg-mingw \
            --nodeps \
            --clean \
            --force \
            --log \
            --noconfirm \
            --noprogressbar

          echo "Built AbiWord package archives:"
          find . -maxdepth 1 -type f -name '*.pkg.tar.*'

      - name: Upload built packages
        uses: actions/upload-artifact@v4
        with:
          name: abiword-wv-i686
          path: |
            wv-pkg/mingw-w64-wv/*.pkg.tar.*
            abiword-pkg/mingw-w64-abiword/*.pkg.tar.*
          if-no-files-found: error
          compression-level: 6
