
name: Build AbiWord UCRT64

on:
  workflow_dispatch:


permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: >-
            base-devel
            msys2-devel
            git
            curl
            zstd
            mingw-w64-ucrt-x86_64-toolchain

      - name: Download and extract AbiWord source
        run: |
          set -euo pipefail

          mkdir -p abiword-pkg

          curl -fL --retry 3 \
            -o abiword.src.tar.zst \
            https://mirror.msys2.org/mingw/sources/mingw-w64-abiword-3.0.8-1.src.tar.zst

          echo "Source archive contents:"
          tar --zstd -tf abiword.src.tar.zst | head -80

          tar --zstd -xf abiword.src.tar.zst \
            -C abiword-pkg

          echo "Extracted package files:"
          find abiword-pkg -maxdepth 3 -type f

          test -f abiword-pkg/mingw-w64-abiword/PKGBUILD

      - name: Build AbiWord for UCRT64
        working-directory: abiword-pkg/mingw-w64-abiword
        run: |
          set -euo pipefail

          export MINGW_ARCH=ucrt64

          echo "Building AbiWord for UCRT64..."
          echo "PKGBUILD: $PWD/PKGBUILD"

          makepkg-mingw \
            --syncdeps \
            --clean \
            --force \
            --log \
            --noconfirm \
            --noprogressbar

      - name: Upload built package
        uses: actions/upload-artifact@v4
        with:
          name: abiword-3.0.8-ucrt64
          path: |
            abiword-pkg/mingw-w64-abiword/*.pkg.tar.zst
            abiword-pkg/mingw-w64-abiword/*.log
          if-no-files-found: error
          retention-days: 14
